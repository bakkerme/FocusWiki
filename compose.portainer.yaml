# Portainer-ready deployment stack for FocusWiki with OpenBao AppRole and a dedicated Tailscale Serve sidecar.
# See docs/PORTAINER.md for OpenBao policy setup, GHCR pull auth, enrollment.json setup, and verification steps.

x-app-runtime: &app-runtime
  image: "${FOCUSWIKI_IMAGE:?Set the pinned FocusWiki image (for example ghcr.io/bakkerme/focuswiki@sha256:...)}"
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-socket-health: &socket-health
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 10s

services:
  init:
    image: "${FOCUSWIKI_IMAGE:?Set the pinned FocusWiki image (for example ghcr.io/bakkerme/focuswiki@sha256:...)}"
    command: [init-volumes]
    restart: "no"
    init: true
    user: '0:0'
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    volumes:
      - repos:/volumes/repos
      - git-state:/volumes/git-state
      - git-socket:/volumes/git-socket
      - serve-socket:/volumes/serve-socket
      - tailscale-state:/volumes/tailscale-state
      - tailscale-config:/volumes/tailscale-config

  git-worker:
    <<: *app-runtime
    command: [git-worker]
    init: true
    user: '0:0'
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      FOCUSWIKI_GIT_SOCKET: /run/focuswiki/git.sock
      FOCUSWIKI_ENROLLMENT_FILE: /etc/focuswiki/enrollment.json
      FOCUSWIKI_REPOS_DIR: /app/repos
      FOCUSWIKI_GIT_STATE_DIR: /var/lib/focuswiki-git
      FOCUSWIKI_GITHUB_APP_KEY_FILE: /run/secrets/focuswiki-github-app.pem
      FOCUSWIKI_GITHUB_APP_ID: "${FOCUSWIKI_GITHUB_APP_ID:?Set the GitHub App ID}"
      FOCUSWIKI_GITHUB_INSTALLATION_ID: "${FOCUSWIKI_GITHUB_INSTALLATION_ID:?Set the GitHub App installation ID}"
      FOCUSWIKI_OPENBAO_ADDR: "${FOCUSWIKI_OPENBAO_ADDR:?Set the HTTPS OpenBao URL (for example https://openbao.tailnet.ts.net)}"
      FOCUSWIKI_OPENBAO_ROLE_ID: "${FOCUSWIKI_OPENBAO_ROLE_ID:?Set the OpenBao AppRole Role ID}"
      FOCUSWIKI_OPENBAO_SECRET_ID: "${FOCUSWIKI_OPENBAO_SECRET_ID:?Set the OpenBao AppRole Secret ID}"
      FOCUSWIKI_OPENBAO_SECRET_PATH: "${FOCUSWIKI_OPENBAO_SECRET_PATH:?Set the OpenBao KV path relative to /v1/ (for example secret/data/focuswiki/github-app)}"
      FOCUSWIKI_OPENBAO_SECRET_FIELD: "${FOCUSWIKI_OPENBAO_SECRET_FIELD:-private_key}"
      FOCUSWIKI_OPENBAO_AUTH_MOUNT: "${FOCUSWIKI_OPENBAO_AUTH_MOUNT:-approle}"
      FOCUSWIKI_OPENBAO_NAMESPACE: "${FOCUSWIKI_OPENBAO_NAMESPACE:-}"
      # Optional: if Docker bridge containers on this NAS cannot route directly to Tailscale,
      # set FOCUSWIKI_TS_OUTBOUND_HTTP_PROXY_LISTEN=:1055 and FOCUSWIKI_OPENBAO_PROXY=http://tailscale:1055.
      FOCUSWIKI_OPENBAO_PROXY: "${FOCUSWIKI_OPENBAO_PROXY:-}"
    volumes:
      - repos:/app/repos
      - git-state:/var/lib/focuswiki-git
      - git-socket:/run/focuswiki
      - type: bind
        source: "${FOCUSWIKI_ENROLLMENT_HOST_PATH:?Set the absolute NAS path to enrollment.json}"
        target: /etc/focuswiki/enrollment.json
        read_only: true
        bind:
          create_host_path: false
    # The worker stores the fetched GitHub App PEM in memory only and may execute a short-lived Git credential helper.
    tmpfs:
      - /tmp:mode=0700,nosuid,nodev,size=64m
      - /run/secrets:mode=0700,nosuid,nodev,noexec,size=1m
    healthcheck:
      <<: *socket-health
      test: [CMD, node, /usr/local/lib/focuswiki/socket-health.mjs, /run/focuswiki/git.sock]

  web:
    <<: *app-runtime
    # Omit `init: true` on non-root `web`: ASUSTOR ADM's host `/sbin/docker-init` is root-only,
    # and `web` runs a single Node process with no child subprocesses.
    command: [web]
    user: '10002:0'
    network_mode: none
    depends_on:
      init:
        condition: service_completed_successfully
      git-worker:
        condition: service_healthy
    environment:
      FOCUSWIKI_PUBLIC_ORIGIN: "${FOCUSWIKI_PUBLIC_ORIGIN:?Set the HTTPS Tailscale Serve origin (for example https://focuswiki.tailnet.ts.net)}"
      FOCUSWIKI_PUBLISHERS: "${FOCUSWIKI_PUBLISHERS:-}"
      FOCUSWIKI_HTTP_SOCKET: /run/focuswiki-serve/http.sock
      FOCUSWIKI_GIT_SOCKET: /run/focuswiki/git.sock
      FOCUSWIKI_ENROLLMENT_FILE: /etc/focuswiki/enrollment.json
      FOCUSWIKI_REPOS_DIR: /app/repos
    volumes:
      - repos:/app/repos
      - git-socket:/run/focuswiki:ro
      - serve-socket:/run/focuswiki-serve
      - type: bind
        source: "${FOCUSWIKI_ENROLLMENT_HOST_PATH:?Set the absolute NAS path to enrollment.json}"
        target: /etc/focuswiki/enrollment.json
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:uid=10002,gid=0,mode=0700,nosuid,nodev,noexec,size=64m
    healthcheck:
      <<: *socket-health
      test: [CMD, node, /usr/local/lib/focuswiki/socket-health.mjs, /run/focuswiki-serve/http.sock]

  tailscale:
    image: "${FOCUSWIKI_TAILSCALE_IMAGE:-tailscale/tailscale:stable}"
    restart: unless-stopped
    user: '0:0'
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      TS_USERSPACE: "true"
      TS_HOSTNAME: "${FOCUSWIKI_TS_HOSTNAME:-focuswiki}"
      TS_AUTHKEY: "${TS_AUTHKEY:-}"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_SERVE_CONFIG: /etc/tailscale-serve/serve.json
      TS_ACCEPT_DNS: "false"
      TS_OUTBOUND_HTTP_PROXY_LISTEN: "${FOCUSWIKI_TS_OUTBOUND_HTTP_PROXY_LISTEN:-}"
      TS_EXTRA_ARGS: "${FOCUSWIKI_TS_EXTRA_ARGS:-}"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - tailscale-config:/etc/tailscale-serve:ro
      - serve-socket:/run/focuswiki-serve:ro
    tmpfs:
      - /tmp:mode=0700,nosuid,nodev,noexec,size=16m
      - /var/run/tailscale:mode=0700,nosuid,nodev,noexec,size=16m

volumes:
  repos:
  git-state:
  git-socket:
  serve-socket:
  tailscale-state:
  tailscale-config:
