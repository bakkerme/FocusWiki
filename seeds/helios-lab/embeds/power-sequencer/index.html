<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Helios Rack Power & Boot Sequencer</title>
  <style>
    :root {
      --bg: #fafbf9;
      --panel: #f2f4f3;
      --ink: #162326;
      --muted: #4e6166;
      --line: #cfd8d7;
      --accent: #1b6b63;
      --warn: #a63429;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    .wrap {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 14px;
    }
    @media (max-width: 640px) { .wrap { grid-template-columns: 1fr; } }
    .rails {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .rail-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 12px;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 5px;
    }
    .rail-meta { font-size: 12px; color: var(--muted); }
    .summary {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 14px;
      font-size: 13px;
    }
    .big-load {
      font-size: 22px;
      font-weight: 700;
      margin: 4px 0 10px 0;
    }
    .warning {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 4px;
      background: #fae8e6;
      color: var(--warn);
      font-size: 12px;
      font-weight: 600;
    }
    .ok {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 4px;
      background: #e1f0ee;
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="rails" id="railsList"></div>
    <div class="summary">
      <div style="color:#4e6166;font-weight:600;font-size:12px;">Simulated Bench Draw (Fictional)</div>
      <div class="big-load" id="totalWatts">0 W / 900 W</div>
      <div>Estimated UPS Holdover: <strong id="holdoverMin">0 min</strong></div>
      <div id="depStatus" class="ok">Boot sequence dependencies satisfied.</div>
    </div>
  </div>
  <script>
    const DEVICES = [
      { id: 'ups', name: 'hlx-ups-bay (PDU Rail A)', watts: 25, requires: null, on: true },
      { id: 'router', name: 'hlx-router-01 (198.51.100.10)', watts: 45, requires: 'ups', on: true },
      { id: 'nas', name: 'hlx-nas-rack (198.51.100.24)', watts: 160, requires: 'router', on: true },
      { id: 'fpga', name: 'hlx-fpga-rig (198.51.100.41)', watts: 310, requires: 'nas', on: false },
      { id: 'optics', name: 'hlx-optics-bench (Laser Stage)', watts: 220, requires: 'ups', on: false }
    ];

    function render() {
      const list = document.getElementById('railsList');
      list.innerHTML = '';
      const activeIds = new Set(DEVICES.filter((d) => d.on).map((d) => d.id));

      DEVICES.forEach((dev) => {
        const row = document.createElement('label');
        row.className = 'rail-item';
        row.innerHTML = `
          <div>
            <div style="font-weight:600;font-size:13px;">${dev.name}</div>
            <div class="rail-meta">${dev.watts} W${dev.requires ? ` · requires ${dev.requires}` : ' · primary feed'}</div>
          </div>
        `;
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = dev.on;
        cb.addEventListener('change', () => {
          dev.on = cb.checked;
          render();
        });
        row.appendChild(cb);
        list.appendChild(row);
      });

      const watts = DEVICES.filter((d) => d.on).reduce((sum, d) => sum + d.watts, 0);
      const batteryWh = 620;
      const runtime = watts > 0 ? Math.round((batteryWh / watts) * 60) : 999;

      document.getElementById('totalWatts').textContent = `${watts} W / 900 W`;
      document.getElementById('holdoverMin').textContent = watts === 0 ? 'Idle' : `${runtime} min`;

      const violations = DEVICES.filter((d) => d.on && d.requires && !activeIds.has(d.requires));
      const statusEl = document.getElementById('depStatus');
      if (violations.length > 0) {
        statusEl.className = 'warning';
        statusEl.textContent = `Sequence violation: ${violations[0].name} powered while ${violations[0].requires} is offline.`;
      } else {
        statusEl.className = 'ok';
        statusEl.textContent = 'Boot sequence dependencies satisfied.';
      }

      window.parent.postMessage({ type: 'cairn:embed:resize', height: Math.max(220, document.documentElement.scrollHeight) }, '*');
    }

    render();
    window.parent.postMessage({ type: 'cairn:embed:ready', height: document.documentElement.scrollHeight }, '*');
  </script>
</body>
</html>
