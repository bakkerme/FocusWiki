<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ward-Breach State Explorer</title>
  <style>
    :root {
      --bg: #fbfcfa;
      --panel: #eef2f1;
      --ink: #142124;
      --muted: #4a5d62;
      --line: #cfd8d7;
      --accent: #17635b;
      --accent-soft: #e1f0ee;
      --warn: #b8741a;
      --danger: #a63429;
    }
    * { box-sizing: border-box; }
    html { height: auto; }
    body {
      margin: 0;
      padding: 14px 16px;
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
    }
    .layout {
      display: grid;
      grid-template-columns: 1.38fr 1fr;
      gap: 14px;
      align-items: start;
    }
    @media (max-width: 660px) {
      .layout { grid-template-columns: 1fr; }
    }
    .diagram-box {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
    .state-node {
      cursor: pointer;
      transition: opacity 120ms ease;
    }
    .state-node:focus-visible rect {
      stroke-width: 2.5;
      stroke: var(--ink);
    }
    .state-node rect {
      fill: #ffffff;
      stroke: #94aaa8;
      stroke-width: 1.6;
      rx: 6;
    }
    .state-node.is-valid rect {
      stroke: var(--accent);
      stroke-dasharray: 4 2;
    }
    .state-node.is-active rect {
      fill: var(--accent);
      stroke: var(--accent);
      stroke-dasharray: none;
    }
    .state-node.is-active.kind-warn rect {
      fill: var(--warn);
      stroke: var(--warn);
    }
    .state-node.is-active.kind-danger rect {
      fill: var(--danger);
      stroke: var(--danger);
    }
    .state-node text {
      font-size: 13.5px;
      font-weight: 600;
      fill: var(--ink);
      pointer-events: none;
    }
    .state-node.is-active text {
      fill: #ffffff;
    }
    .edge {
      stroke: #afc0be;
      stroke-width: 1.7;
      fill: none;
    }
    .edge.is-available {
      stroke: var(--accent);
      stroke-width: 2.3;
    }
    .inspector {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 13px 14px;
      background: #ffffff;
    }
    .state-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 6px;
    }
    .state-title {
      font-size: 15.5px;
      font-weight: 700;
      margin: 0;
    }
    .owner-pill {
      font-size: 11.5px;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
      white-space: nowrap;
    }
    .desc {
      font-size: 12.8px;
      color: var(--muted);
      margin: 0 0 10px 0;
    }
    .triggers-label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .triggers {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    button.trigger-btn {
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 4px;
      border: 1px solid var(--accent);
      background: var(--accent-soft);
      color: var(--ink);
      cursor: pointer;
    }
    button.trigger-btn:hover {
      background: var(--accent);
      color: #ffffff;
    }
    button.trigger-btn.secondary {
      border-color: var(--line);
      background: var(--panel);
    }
    button.trigger-btn.secondary:hover {
      background: #dfe6e5;
      color: var(--ink);
    }
    pre.payload {
      margin: 0;
      padding: 9px 10px;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 11.5px;
      line-height: 1.45;
      background: var(--panel);
      border-radius: 4px;
      border: 1px solid var(--line);
      overflow-x: auto;
      color: var(--ink);
    }
    .hint {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="layout">
    <div class="diagram-box">
      <svg viewBox="0 0 424 228" role="img" aria-label="Ward-Breach state machine graph">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c9391" />
          </marker>
        </defs>
        <path id="edge-idle-intent" class="edge" d="M 96 34 L 138 34" marker-end="url(#arrow)" />
        <path id="edge-intent-stakes" class="edge" d="M 274 34 L 302 34" marker-end="url(#arrow)" />
        <path id="edge-intent-idle" class="edge" d="M 206 54 C 190 80, 76 80, 54 54" marker-end="url(#arrow)" />
        <path id="edge-stakes-roll" class="edge" d="M 358 54 L 256 104" marker-end="url(#arrow)" />
        <path id="edge-roll-clean" class="edge" d="M 180 144 L 88 180" marker-end="url(#arrow)" />
        <path id="edge-roll-strained" class="edge" d="M 212 144 L 212 180" marker-end="url(#arrow)" />
        <path id="edge-roll-backlash" class="edge" d="M 244 144 L 336 180" marker-end="url(#arrow)" />

        <g class="state-node" data-state="idle" tabindex="0" role="button" aria-label="Idle state">
          <rect x="12" y="14" width="84" height="40" />
          <text x="54" y="39" text-anchor="middle">Idle</text>
        </g>
        <g class="state-node" data-state="declare_intent" tabindex="0" role="button" aria-label="Intent Declared state">
          <rect x="138" y="14" width="136" height="40" />
          <text x="206" y="39" text-anchor="middle">Intent Declared</text>
        </g>
        <g class="state-node" data-state="stakes_locked" tabindex="0" role="button" aria-label="Stakes Locked state">
          <rect x="302" y="14" width="110" height="40" />
          <text x="357" y="39" text-anchor="middle">Stakes Locked</text>
        </g>
        <g class="state-node" data-state="resolving_roll" tabindex="0" role="button" aria-label="Resolving Check state">
          <rect x="142" y="104" width="140" height="40" />
          <text x="212" y="129" text-anchor="middle">Resolving Check</text>
        </g>
        <g class="state-node" data-state="clean_breach" tabindex="0" role="button" aria-label="Clean Breach outcome">
          <rect x="10" y="180" width="126" height="40" />
          <text x="73" y="205" text-anchor="middle">Clean Breach</text>
        </g>
        <g class="state-node kind-warn" data-state="strained_entry" tabindex="0" role="button" aria-label="Strained Entry outcome">
          <rect x="149" y="180" width="126" height="40" />
          <text x="212" y="205" text-anchor="middle">Strained Entry</text>
        </g>
        <g class="state-node kind-danger" data-state="ward_backlash" tabindex="0" role="button" aria-label="Ward Backlash outcome">
          <rect x="288" y="180" width="126" height="40" />
          <text x="351" y="205" text-anchor="middle">Ward Backlash</text>
        </g>
      </svg>
      <div class="hint">Select any highlighted state node or transition button to step the state machine.</div>
    </div>

    <div class="inspector">
      <div class="state-header">
        <h3 class="state-title" id="stateTitle">Idle</h3>
        <span class="owner-pill" id="stateOwner">Player</span>
      </div>
      <p class="desc" id="stateDesc"></p>

      <div class="triggers-label">Valid transitions</div>
      <div class="triggers" id="triggerButtons"></div>

      <div class="triggers-label">Engine state snapshot</div>
      <pre class="payload" id="statePayload"></pre>
    </div>
  </div>

  <script>
    const STATES = {
      idle: {
        title: 'Idle (Threshold Sealed)',
        owner: 'Player',
        desc: 'Doorway runes are dormant. Player may inspect ward tier or declare a Breach attempt without spending oil.',
        edges: [
          { to: 'declare_intent', label: 'Declare Breach', edgeId: 'edge-idle-intent' }
        ],
        payload: { phase: 'idle', oilCommitted: 0, wardResonance: 1, doorLocked: true }
      },
      declare_intent: {
        title: 'Intent Declared',
        owner: 'Player + Engine',
        desc: 'Engine previews Rigging modifier and Ward Tier penalty. Player may still abort freely before oil is spent.',
        edges: [
          { to: 'stakes_locked', label: 'Commit Lantern Oil', edgeId: 'edge-intent-stakes' },
          { to: 'idle', label: 'Withdraw Attempt', edgeId: 'edge-intent-idle' }
        ],
        payload: { phase: 'declare_intent', previewModifier: '+2 Rigging, -1 Tier II', abortAllowed: true }
      },
      stakes_locked: {
        title: 'Stakes Locked',
        owner: 'Rules Engine',
        desc: 'Lantern charges are deducted atomically. Retreating is no longer free; the roll must now resolve.',
        edges: [
          { to: 'resolving_roll', label: 'Roll 2d6 Check', edgeId: 'edge-stakes-roll' }
        ],
        payload: { phase: 'stakes_locked', oilCommitted: 2, abortAllowed: false, netBonus: 3 }
      },
      resolving_roll: {
        title: 'Resolving Check',
        owner: 'Rules Engine',
        desc: 'Engine sums 2d6 + Rigging + Oil - Ward Penalty and routes strictly into one of three threshold bands.',
        edges: [
          { to: 'clean_breach', label: 'Total 10+ (Clean)', edgeId: 'edge-roll-clean' },
          { to: 'strained_entry', label: 'Total 7–9 (Strained)', edgeId: 'edge-roll-strained' },
          { to: 'ward_backlash', label: 'Total ≤6 (Backlash)', edgeId: 'edge-roll-backlash' }
        ],
        payload: { phase: 'resolving_roll', formula: '2d6 + rigging + oil - wardTierPenalty' }
      },
      clean_breach: {
        title: 'Clean Breach (10+)',
        owner: 'Encounter Model',
        desc: 'Seal unlatches silently. Ward Resonance remains unchanged and the delve team keeps initiative.',
        edges: [{ to: 'idle', label: 'Reset Demo Doorway', edgeId: '' }],
        payload: { outcome: 'clean_breach', doorLocked: false, resonanceDelta: 0, alertTriggered: false }
      },
      strained_entry: {
        title: 'Strained Entry (7–9)',
        owner: 'Encounter Model + Player',
        desc: 'Seal opens, but Ward Resonance ticks +1 and player chooses one cost: vent 1 extra oil or draw patrol notice.',
        edges: [{ to: 'idle', label: 'Reset Demo Doorway', edgeId: '' }],
        payload: { outcome: 'strained_entry', doorLocked: false, resonanceDelta: 1, pendingChoice: ['vent_oil', 'patrol_notice'] }
      },
      ward_backlash: {
        title: 'Ward Backlash (≤6)',
        owner: 'Encounter Model / GM',
        desc: 'Seal fractures into unstable resonance (+2 clock), dealing arc shock and leaving the iron latch jammed.',
        edges: [{ to: 'idle', label: 'Reset Demo Doorway', edgeId: '' }],
        payload: { outcome: 'ward_backlash', doorLocked: true, resonanceDelta: 2, unstableFracture: true }
      }
    };

    let instanceId = new URLSearchParams(window.location.search).get('instance') || undefined;
    let currentState = 'declare_intent';
    let transitionCount = 0;

    function measureIntrinsicHeight() {
      return Math.max(140, Math.ceil(document.body.getBoundingClientRect().height));
    }

    function reportHeight(msgType = 'cairn:embed:resize') {
      window.parent.postMessage(
        { type: msgType, instanceId, height: measureIntrinsicHeight() },
        '*'
      );
    }

    function setState(nextState) {
      if (!STATES[nextState]) return;
      currentState = nextState;
      transitionCount += 1;
      render();
      window.parent.postMessage(
        {
          type: 'cairn:embed:telemetry',
          instanceId,
          summary: `State: ${STATES[currentState].title} (${transitionCount} steps)`
        },
        '*'
      );
    }

    function render() {
      const info = STATES[currentState];
      document.getElementById('stateTitle').textContent = info.title;
      document.getElementById('stateOwner').textContent = info.owner;
      document.getElementById('stateDesc').textContent = info.desc;
      document.getElementById('statePayload').textContent = JSON.stringify(info.payload, null, 2);

      const validTargets = new Set(info.edges.map((e) => e.to));
      const validEdgeIds = new Set(info.edges.map((e) => e.edgeId).filter(Boolean));

      document.querySelectorAll('.state-node').forEach((el) => {
        const key = el.getAttribute('data-state');
        el.classList.toggle('is-active', key === currentState);
        el.classList.toggle('is-valid', key !== currentState && validTargets.has(key));
      });

      document.querySelectorAll('.edge').forEach((el) => {
        el.classList.toggle('is-available', validEdgeIds.has(el.id));
      });

      const btnContainer = document.getElementById('triggerButtons');
      btnContainer.innerHTML = '';
      info.edges.forEach((edge) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'trigger-btn' + (edge.to === 'idle' && currentState !== 'declare_intent' ? ' secondary' : '');
        btn.textContent = edge.label;
        btn.addEventListener('click', () => setState(edge.to));
        btnContainer.appendChild(btn);
      });

      reportHeight('cairn:embed:resize');
    }

    document.querySelectorAll('.state-node').forEach((el) => {
      const activate = () => setState(el.getAttribute('data-state'));
      el.addEventListener('click', activate);
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          activate();
        }
      });
    });

    window.addEventListener('message', (event) => {
      const data = event.data;
      if (data && data.type === 'cairn:embed:init') {
        if (typeof data.instanceId === 'string') {
          instanceId = data.instanceId;
        }
        if (data.props && typeof data.props.initialState === 'string' && STATES[data.props.initialState]) {
          currentState = data.props.initialState;
          render();
        } else {
          reportHeight('cairn:embed:resize');
        }
      }
    });

    if (typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(() => reportHeight('cairn:embed:resize')).observe(document.body);
    }
    window.addEventListener('resize', () => reportHeight('cairn:embed:resize'));

    render();
    reportHeight('cairn:embed:ready');
  </script>
</body>
</html>
