name: Docker CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Test and build image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      release-ready: ${{ steps.smoke.outputs.release-ready }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Build and smoke-test Docker image
        id: smoke
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "focuswiki:${GITHUB_SHA}" .
          node scripts/docker-smoke.mjs "focuswiki:${GITHUB_SHA}"
      - name: Archive tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.smoke.outputs.release-ready == 'true'
        run: docker save "focuswiki:${GITHUB_SHA}" | gzip -1 > "$RUNNER_TEMP/focuswiki.tar.gz"
      - name: Upload tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.smoke.outputs.release-ready == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: focuswiki-image
          path: ${{ runner.temp }}/focuswiki.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  publish:
    name: Publish image to GHCR
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.release-ready == 'true'
    needs: build
    environment: registry-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: focuswiki-image
          path: ${{ runner.temp }}
      - name: Load tested image
        run: docker load --input "$RUNNER_TEMP/focuswiki.tar.gz"
      - name: Push tested image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          repo_lower="${GITHUB_REPOSITORY,,}"
          image="ghcr.io/${repo_lower}:${GITHUB_SHA}"
          docker tag "focuswiki:${GITHUB_SHA}" "$image"
          docker push "$image"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$image")"
          {
            printf 'Published `%s`\n' "$image"
            if [ -n "$digest" ]; then
              printf 'Pinned digest: `%s`\n' "$digest"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
