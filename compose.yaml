services:
  focuswiki:
    build:
      context: .
      dockerfile: Dockerfile
    image: focuswiki:latest
    container_name: focuswiki
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "8088"
      FOCUSWIKI_BIND_HOST: "0.0.0.0"
      PROJECTS_CONFIG: "/app/config/projects.json"
      FOCUSWIKI_REPOS_DIR: "/app/repos"
      FOCUSWIKI_ALLOWED_IMPORT_ROOTS: "/app/repos,/app/sample-repos"
    # Choose a private LAN address explicitly when access beyond loopback is needed.
    ports:
      - "${FOCUSWIKI_BIND_HOST:-127.0.0.1}:8088:8088"
    volumes:
      - ./sample-repos:/app/sample-repos
      - ./repos:/app/repos
      - ./config:/app/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8088/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
