services:
  focuswiki:
    build:
      context: .
      target: web
    image: focuswiki:latest
    restart: unless-stopped
    init: true
    ports:
      - "${FOCUSWIKI_BIND_HOST:-127.0.0.1}:8088:8088"
    volumes:
      - samples:/app/sample-repos
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  samples:
